<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集中タイマー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            /* スクロールバー非表示（UI崩れ防止） */
            -ms-overflow-style: none; 
            scrollbar-width: none;
        }
        body::-webkit-scrollbar { display: none; }
        
        /* 円形プログレスバーの初期設定 */
        #progress-ring {
            transition: stroke-dashoffset 0.1s linear, stroke 0.5s ease;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4 selection:bg-blue-500 selection:text-white">

    <!-- 設定画面 -->
    <div id="setup-screen" class="w-full max-w-md flex flex-col items-center gap-6 animate-fade-in">
        <div class="text-center">
            <h1 class="text-4xl font-bold mb-2 text-white tracking-tight">Focus Timer</h1>
            <p class="text-gray-400">集中したい時間を設定してください</p>
        </div>

        <div class="w-full bg-gray-800 p-6 rounded-3xl shadow-2xl border border-gray-700">
            <label class="block text-sm font-medium text-gray-400 mb-3 text-center">手動入力 (1〜120分)</label>
            <div class="flex items-center gap-4 mb-6 justify-center">
                <input type="number" id="custom-time" min="1" max="120" value="30" 
                       class="w-32 text-4xl p-4 rounded-xl border-2 border-gray-600 bg-gray-900 text-white text-center focus:outline-none focus:border-blue-500 transition-colors">
                <span class="text-2xl text-gray-400 font-semibold">分</span>
            </div>

            <!-- クイック選択ボタン -->
            <div class="grid grid-cols-4 gap-2 mb-6">
                <button onclick="setQuickTime(2)" class="py-3 bg-gray-700 hover:bg-gray-600 rounded-xl transition-colors font-medium">2分</button>
                <button onclick="setQuickTime(3)" class="py-3 bg-gray-700 hover:bg-gray-600 rounded-xl transition-colors font-medium">3分</button>
                <button onclick="setQuickTime(5)" class="py-3 bg-gray-700 hover:bg-gray-600 rounded-xl transition-colors font-medium">5分</button>
                <button onclick="setQuickTime(10)" class="py-3 bg-gray-700 hover:bg-gray-600 rounded-xl transition-colors font-medium">10分</button>
                <button onclick="setQuickTime(15)" class="py-3 bg-gray-700 hover:bg-gray-600 rounded-xl transition-colors font-medium">15分</button>
                <button onclick="setQuickTime(20)" class="py-3 bg-gray-700 hover:bg-gray-600 rounded-xl transition-colors font-medium">20分</button>
                <button onclick="setQuickTime(30)" class="py-3 bg-blue-600 hover:bg-blue-500 rounded-xl transition-colors font-bold shadow-lg shadow-blue-500/30 col-span-2">30分</button>
            </div>

            <button onclick="startTimerSession()" class="w-full py-4 bg-green-500 hover:bg-green-400 text-gray-900 text-xl font-bold rounded-xl shadow-lg shadow-green-500/20 transition-transform transform active:scale-95">
                スタート
            </button>
        </div>
        
        <!-- 音量設定 -->
        <div class="w-full bg-gray-800 p-5 rounded-2xl shadow-lg border border-gray-700 flex items-center gap-4">
            <span class="text-xl">🔈</span>
            <input type="range" id="volume-slider-setup" min="0" max="1" step="0.1" value="1" class="w-full h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-blue-500">
            <span class="text-xl">🔊</span>
            <button type="button" onclick="toggleMute()" class="mute-btn shrink-0 px-3 py-2 bg-gray-700 hover:bg-gray-600 border border-gray-600 rounded-xl transition-colors font-medium" aria-label="音声を消音する">
                <span class="mute-icon">🔊</span> <span class="mute-label">消音</span>
            </button>
        </div>
    </div>

    <!-- タイマー画面 -->
    <div id="timer-screen" class="hidden w-full max-w-md flex flex-col items-center gap-8">
        <div class="relative w-72 h-72 flex items-center justify-center">
            <!-- 円形プログレスバーSVG -->
            <svg class="absolute top-0 left-0 w-full h-full transform -rotate-90 drop-shadow-lg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="none" stroke="#374151" stroke-width="6"></circle>
                <circle id="progress-ring" cx="50" cy="50" r="45" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" stroke-dasharray="282.74" stroke-dashoffset="0"></circle>
            </svg>
            <div class="z-10 text-center flex flex-col items-center">
                <div id="time-display" class="text-6xl font-bold tracking-wider font-variant-numeric: tabular-nums;">30:00</div>
                <div id="status-text" class="hidden" aria-live="polite"></div>
            </div>
        </div>

        <div class="w-full bg-gray-800 p-5 rounded-2xl shadow-lg border border-gray-700 flex items-center gap-4">
            <span class="text-xl">🔈</span>
            <input type="range" id="volume-slider-timer" min="0" max="1" step="0.1" value="1" class="w-full h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-blue-500">
            <span class="text-xl">🔊</span>
            <button type="button" onclick="toggleMute()" class="mute-btn shrink-0 px-3 py-2 bg-gray-700 hover:bg-gray-600 border border-gray-600 rounded-xl transition-colors font-medium" aria-label="音声を消音する">
                <span class="mute-icon">🔊</span> <span class="mute-label">消音</span>
            </button>
        </div>

        <div class="flex gap-4 w-full">
            <button id="pause-btn" onclick="pauseResumeTimer()" class="flex-1 py-4 bg-yellow-600 hover:bg-yellow-500 text-white text-lg font-bold rounded-xl shadow-lg shadow-yellow-600/20 transition-transform transform active:scale-95">
                一時停止
            </button>
            <button onclick="stopTimer()" class="flex-1 py-4 bg-red-600 hover:bg-red-500 text-white text-lg font-bold rounded-xl shadow-lg shadow-red-600/20 transition-transform transform active:scale-95">
                中止する
            </button>
        </div>
    </div>

    <!-- 終了画面 -->
    <div id="finish-screen" class="hidden w-full max-w-md flex flex-col items-center gap-8 z-50">
        <div class="bg-gray-800 p-8 rounded-3xl shadow-2xl border border-gray-700 text-center w-full relative overflow-hidden">
            <div class="text-6xl mb-4">🎉</div>
            <h2 class="text-4xl font-bold text-green-400 mb-4 tracking-tight">お疲れ様でした！</h2>
            <p class="text-gray-300 text-lg mb-8">設定した集中セッションが完了しました。</p>
            
            <button onclick="resetApp()" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white text-xl font-bold rounded-xl shadow-lg shadow-blue-500/30 transition-transform transform active:scale-95">
                もう一度セットする
            </button>
        </div>
    </div>

    <script>
        // DOM要素の取得
        const setupScreen = document.getElementById('setup-screen');
        const timerScreen = document.getElementById('timer-screen');
        const finishScreen = document.getElementById('finish-screen');
        
        const customTimeInput = document.getElementById('custom-time');
        const timeDisplay = document.getElementById('time-display');
        const progressRing = document.getElementById('progress-ring');
        const pauseBtn = document.getElementById('pause-btn');
        const statusText = document.getElementById('status-text');
        
        const volumeSliderSetup = document.getElementById('volume-slider-setup');
        const volumeSliderTimer = document.getElementById('volume-slider-timer');
        const muteBtns = document.querySelectorAll('.mute-btn');
        const muteIcons = document.querySelectorAll('.mute-icon');
        const muteLabels = document.querySelectorAll('.mute-label');

        // 状態管理変数
        let currentPhase = 'IDLE'; // PREPARING, FOCUSING, COOLDOWN, PAUSED, FINISHED
        let focusTimeSeconds = 0;  // 集中設定時間（秒）
        let totalPhaseSeconds = 0; // 現在のフェーズの総時間（秒）
        let endTime = 0;           // 終了予定時刻（ミリ秒）
        let timeLeft = 0;          // 残り時間（秒）
        let timerInterval = null;
        let lastAnnouncedSecond = -1; 
        let isConfettiRunning = false;
        let currentVolume = 1.0;
        let isMuted = false;
        let wakeLock = null;

        const circumference = 2 * Math.PI * 45; 
        
        // 音声設定のロード
        let voices = [];
        let preferredVoice = null;

        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
            // Google 日本語 などを最優先で探索
            preferredVoice = voices.find(voice => voice.name.includes('Google') && voice.lang.includes('ja')) ||
                             voices.find(voice => voice.name === 'Google 日本語') ||
                             voices.find(voice => voice.lang === 'ja-JP') || 
                             null;
        }

        loadVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }
        
        // 音量・ミュート制御
        volumeSliderSetup.addEventListener('input', (e) => {
            currentVolume = parseFloat(e.target.value);
            volumeSliderTimer.value = currentVolume;
            if (currentVolume > 0 && isMuted) toggleMute();
        });
        volumeSliderTimer.addEventListener('input', (e) => {
            currentVolume = parseFloat(e.target.value);
            volumeSliderSetup.value = currentVolume;
            if (currentVolume > 0 && isMuted) toggleMute();
        });

        function toggleMute() {
            isMuted = !isMuted;
            muteIcons.forEach(icon => { icon.textContent = isMuted ? "🔇" : "🔊"; });
            muteLabels.forEach(label => { label.textContent = isMuted ? "消音解除" : "消音"; });
            muteBtns.forEach(btn => {
                btn.classList.toggle('bg-red-900/50', isMuted);
                btn.classList.toggle('border-red-500', isMuted);
                btn.setAttribute('aria-label', isMuted ? '音声の消音を解除する' : '音声を消音する');
                btn.setAttribute('aria-pressed', isMuted.toString());
            });
        }

        // 画面スリープ防止
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.warn(`Wake Lock APIエラー: ${err.name}`);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        // 音声読み上げ
        function speak(text) {
            if (isMuted || currentVolume === 0 || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            if (preferredVoice) utterance.voice = preferredVoice;
            utterance.volume = currentVolume;
            utterance.rate = 0.95;

            window.speechSynthesis.speak(utterance);
        }

        function setQuickTime(minutes) {
            customTimeInput.value = minutes;
        }

        // タイマー開始 (準備時間30秒からスタート)
        function startTimerSession() {
            let minutes = parseInt(customTimeInput.value);
            if (isNaN(minutes) || minutes < 1 || minutes > 120) {
                alert("1から120の間の数値を入力してください。");
                return;
            }

            focusTimeSeconds = minutes * 60;
            
            // UI切替
            setupScreen.classList.add('hidden');
            finishScreen.classList.add('hidden');
            timerScreen.classList.remove('hidden');
            
            pauseBtn.textContent = "一時停止";
            pauseBtn.className = "flex-1 py-4 bg-yellow-600 hover:bg-yellow-500 text-white text-lg font-bold rounded-xl shadow-lg shadow-yellow-600/20 transition-transform transform active:scale-95";
            
            requestWakeLock();
            
            // 準備フェーズへ移行
            enterPreparationPhase();
        }

        // 準備フェーズ（30秒）
        function enterPreparationPhase() {
            currentPhase = 'PREPARING';
            totalPhaseSeconds = 30;
            timeLeft = 30;
            statusText.textContent = "Preparation (30s)";
            speak("準備時間です。リラックスしてください。");
            
            lastAnnouncedSecond = -1;
            endTime = Date.now() + (timeLeft * 1000);
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(tick, 100);
        }

        // 集中フェーズ
        function enterFocusPhase() {
            currentPhase = 'FOCUSING';
            totalPhaseSeconds = focusTimeSeconds;
            timeLeft = focusTimeSeconds;
            statusText.textContent = "Focusing";
            speak("集中タイムを開始します。");
            
            lastAnnouncedSecond = -1;
            endTime = Date.now() + (timeLeft * 1000);
        }

        // クールダウンフェーズ（30秒）
        function enterCooldownPhase() {
            currentPhase = 'COOLDOWN';
            totalPhaseSeconds = 30;
            timeLeft = 30;
            statusText.textContent = "Cool Down (30s)";
            speak("お疲れ様でした。クールダウン時間です。");
            
            lastAnnouncedSecond = -1;
            endTime = Date.now() + (timeLeft * 1000);
        }

        // タイマーの刻み処理
        function tick() {
            if (currentPhase === 'PAUSED') return;

            const now = Date.now();
            timeLeft = Math.max(0, Math.ceil((endTime - now) / 1000));

            updateTimerDisplay();
            checkAnnouncements();

            if (timeLeft <= 0) {
                if (currentPhase === 'PREPARING') {
                    enterFocusPhase();
                } else if (currentPhase === 'FOCUSING') {
                    enterCooldownPhase();
                } else if (currentPhase === 'COOLDOWN') {
                    finishSession();
                }
            }
        }

        // アナウンス判定
        function checkAnnouncements() {
            if (lastAnnouncedSecond === timeLeft) return;
            lastAnnouncedSecond = timeLeft;

            if (currentPhase === 'FOCUSING') {
                const halfTime = Math.floor(focusTimeSeconds / 2);
                
                if (timeLeft === halfTime && focusTimeSeconds >= 120) {
                    speak("半分の時間が経過しました。");
                }
                if (timeLeft === 1200 && focusTimeSeconds > 1200) {
                    speak("残り、20分です。");
                }
                if (timeLeft === 600 && focusTimeSeconds > 600) {
                    speak("残り、10分です。");
                }
                if (timeLeft === 300 && focusTimeSeconds > 300) {
                    speak("残り、5分です。");
                }
                if (timeLeft === 180 && focusTimeSeconds > 180) {
                    speak("残り、3分です。");
                }
                if (timeLeft === 60) {
                    speak("残り、1分です。ラストスパートです。");
                }
                if (timeLeft === 10) {
                    speak("10秒前");
                }
                if (timeLeft === 3) {
                    speak("3秒前");
                }
            }
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            
            timeDisplay.textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
            const progress = timeLeft / totalPhaseSeconds;
            const offset = circumference - (progress * circumference);
            progressRing.style.strokeDashoffset = offset;
            
            if (currentPhase === 'FOCUSING' && timeLeft <= 60 && timeLeft > 0) {
                progressRing.setAttribute('stroke', '#ef4444'); 
            } else if (currentPhase === 'PREPARING' || currentPhase === 'COOLDOWN') {
                progressRing.setAttribute('stroke', '#eab308'); 
            } else {
                progressRing.setAttribute('stroke', '#3b82f6'); 
            }
        }

        function pauseResumeTimer() {
            if (currentPhase === 'RUNNING' || currentPhase === 'PREPARING' || currentPhase === 'FOCUSING' || currentPhase === 'COOLDOWN') {
                const prevPhase = currentPhase;
                currentPhase = 'PAUSED';
                pauseBtn.textContent = "再開";
                pauseBtn.className = "flex-1 py-4 bg-green-600 hover:bg-green-500 text-white text-lg font-bold rounded-xl shadow-lg shadow-green-600/20 transition-transform transform active:scale-95";
                statusText.textContent = "Paused";
                speak("一時停止しました。");
                // 一時停止前の状態を保持できるように記憶しておく
                pauseBtn.dataset.prevPhase = prevPhase;
            } else if (currentPhase === 'PAUSED') {
                currentPhase = pauseBtn.dataset.prevPhase || 'FOCUSING';
                endTime = Date.now() + (timeLeft * 1000);
                pauseBtn.textContent = "一時停止";
                pauseBtn.className = "flex-1 py-4 bg-yellow-600 hover:bg-yellow-500 text-white text-lg font-bold rounded-xl shadow-lg shadow-yellow-600/20 transition-transform transform active:scale-95";
                statusText.textContent = currentPhase === 'PREPARING' ? "Preparation (30s)" : currentPhase === 'COOLDOWN' ? "Cool Down (30s)" : "Focusing";
                speak("再開します。");
            }
        }

        function stopTimer() {
            speak("タイマーを中止しました。");
            resetApp();
        }

        function finishSession() {
            if (timerInterval) clearInterval(timerInterval);
            currentPhase = 'FINISHED';
            
            speak("終了しました。お疲れ様でした。");
            
            timerScreen.classList.add('hidden');
            finishScreen.classList.remove('hidden');
            
            releaseWakeLock();
            
            isConfettiRunning = true;
            triggerConfetti();
        }

        function triggerConfetti() {
            (function frame() {
                if (!isConfettiRunning) return;

                confetti({
                    particleCount: 3,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#f472b6', '#fde047', '#7dd3fc']
                });
                
                confetti({
                    particleCount: 3,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#f472b6', '#fde047', '#7dd3fc']
                });

                requestAnimationFrame(frame);
            }());
        }

        function resetApp() {
            if (timerInterval) clearInterval(timerInterval);
            currentPhase = 'IDLE';
            isConfettiRunning = false;
            releaseWakeLock();
            
            timerScreen.classList.add('hidden');
            finishScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
            
            progressRing.setAttribute('stroke', '#3b82f6');
            lastAnnouncedSecond = -1;
        }
    </script>
</body>
</html>
