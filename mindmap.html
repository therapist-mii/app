<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA / スマホホーム画面追加用の設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="願いのマップ">
    <meta name="application-name" content="願いのマップ">
    <title>願いのマップ</title>
    <!-- ✨マークのアイコンをSVGデータURIとして設定 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23FFFBF0%22/><text x=%2250%22 y=%2250%22 font-size=%2270%22 text-anchor=%22middle%22 dominant-baseline=%22central%22>✨</text></svg>">

    <!-- Tailwind CSS, React, ReactDOM, Babel -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* デフォルトのスクロールや選択操作を無効化（アプリらしい操作感にするため） */
        body {
            overscroll-behavior-y: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            background-color: #FFFBF0; /* 優しいクリーム色の背景 */
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded Mplus 1c', 'Quicksand', sans-serif;
        }
        
        /* 隠しスクロールバー */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        /* カスタムレンジスライダー（パステル調） */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #AEC6CF;
            cursor: pointer;
            margin-top: -8px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // パステルカラーのパレット（テキストの背景用）
        const PASTEL_COLORS = [
            '#FFD1DC', '#FFDFD3', '#FDFD96', '#C1E1C1', '#AEC6CF', '#B39EB5', '#F4F4F4', '#FFE5B4', '#E6E6FA', '#FFF0F5'
        ];

        // --- アイコンコンポーネント ---
        const IconPlus = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const IconText = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>;
        const IconImage = () => <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>;
        const IconTrash = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;

        // --- ドラッグ可能な要素のラッパー ---
        const DraggableItem = ({ item, updateItem, bringToFront, onClick, children }) => {
            const [pos, setPos] = useState({ x: item.x, y: item.y });
            const dragInfo = useRef({ startX: 0, startY: 0, initialX: 0, initialY: 0, isDragging: false, moved: false });

            useEffect(() => {
                setPos({ x: item.x, y: item.y });
            }, [item.x, item.y]);

            const handlePointerDown = (e) => {
                e.preventDefault(); // デフォルトのスクロールなどを防ぐ
                e.target.setPointerCapture(e.pointerId);
                
                dragInfo.current = {
                    startX: e.clientX,
                    startY: e.clientY,
                    initialX: pos.x,
                    initialY: pos.y,
                    isDragging: true,
                    moved: false
                };
                bringToFront(item.id); // 触った要素を最前面へ
            };

            const handlePointerMove = (e) => {
                if (!dragInfo.current.isDragging) return;
                
                const dx = e.clientX - dragInfo.current.startX;
                const dy = e.clientY - dragInfo.current.startY;
                
                // わずかなブレはクリックと判定させるための閾値
                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                    dragInfo.current.moved = true;
                }
                
                setPos({
                    x: dragInfo.current.initialX + dx,
                    y: dragInfo.current.initialY + dy
                });
            };

            const handlePointerUp = (e) => {
                if (!dragInfo.current.isDragging) return;
                dragInfo.current.isDragging = false;
                e.target.releasePointerCapture(e.pointerId);

                // 位置が確定したら親のStateを更新
                updateItem(item.id, { x: pos.x, y: pos.y });

                // 動かしていなければクリック（タップ）と判定して編集モードを開く
                if (!dragInfo.current.moved && onClick) {
                    onClick(item);
                }
            };

            return (
                <div
                    style={{ position: 'absolute', left: pos.x, top: pos.y, touchAction: 'none' }}
                    onPointerDown={handlePointerDown}
                    onPointerMove={handlePointerMove}
                    onPointerUp={handlePointerUp}
                    onPointerCancel={handlePointerUp}
                >
                    {/* 子要素へのPointerEventを無効化してラッパーでキャッチする */}
                    <div style={{ pointerEvents: 'none' }}>
                        {children}
                    </div>
                </div>
            );
        };

        const App = () => {
            // 基本設定：最初は「願い」というタブが1つある
            const [tabs, setTabs] = useState([{ id: 'default', name: '願い' }]);
            const [activeTabId, setActiveTabId] = useState('default');
            const [items, setItems] = useState([]);

            // モーダルの状態管理
            const [editingTextItem, setEditingTextItem] = useState(null);
            const [editingImageItem, setEditingImageItem] = useState(null);
            const [isTabModalOpen, setIsTabModalOpen] = useState(false);
            const [newTabName, setNewTabName] = useState('');

            // ファイル入力用Ref
            const fileInputRef = useRef(null);

            // --- アイテム操作系 ---
            const bringToFront = (id) => {
                setItems(prev => {
                    const item = prev.find(i => i.id === id);
                    if (!item) return prev;
                    return [...prev.filter(i => i.id !== id), item];
                });
            };

            const updateItem = (id, newProps) => {
                setItems(prev => prev.map(item => item.id === id ? { ...item, ...newProps } : item));
            };

            const deleteItem = (id) => {
                setItems(prev => prev.filter(item => item.id !== id));
            };

            // --- 新規追加系 ---
            const handleAddTextClick = () => {
                const center = getCenterPos();
                setEditingTextItem({
                    id: Date.now().toString(),
                    tabId: activeTabId,
                    type: 'text',
                    content: '',
                    color: PASTEL_COLORS[0],
                    x: center.x - 50,
                    y: center.y - 20,
                    isNew: true
                });
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const src = URL.createObjectURL(file);
                const center = getCenterPos();
                
                const newItem = {
                    id: Date.now().toString(),
                    tabId: activeTabId,
                    type: 'image',
                    src: src,
                    size: 100, // デフォルトサイズ
                    x: center.x - 50,
                    y: center.y - 50
                };
                
                setItems(prev => [...prev, newItem]);
                
                // 追加後すぐにサイズ調整できるようモーダルを開く
                setEditingImageItem({ ...newItem, isNew: true });
                
                // Inputをリセット
                e.target.value = '';
            };

            const getCenterPos = () => {
                return {
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2
                };
            };

            // --- タブ操作系 ---
            const handleAddTab = () => {
                if (!newTabName.trim()) return;
                const newId = Date.now().toString();
                setTabs(prev => [...prev, { id: newId, name: newTabName.trim() }]);
                setActiveTabId(newId);
                setNewTabName('');
                setIsTabModalOpen(false);
            };

            // 現在のタブに属するアイテムのみ抽出
            const currentItems = items.filter(item => item.tabId === activeTabId);

            return (
                <div className="h-screen w-full flex flex-col relative overflow-hidden">
                    {/* ヘッダー / タブバー */}
                    <div className="bg-[#FFFBF0]/90 backdrop-blur-md z-10 shadow-sm border-b border-[#EEDCBA]">
                        <div className="flex items-center px-4 py-3 overflow-x-auto">
                            {tabs.map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTabId(tab.id)}
                                    className={`shrink-0 px-4 py-2 rounded-full text-sm font-bold mr-3 transition-colors ${
                                        activeTabId === tab.id 
                                        ? 'bg-[#FFD1DC] text-[#554]' 
                                        : 'bg-white text-gray-500 shadow-sm'
                                    }`}
                                >
                                    {tab.name}
                                </button>
                            ))}
                            <button 
                                onClick={() => setIsTabModalOpen(true)}
                                className="shrink-0 w-9 h-9 flex items-center justify-center rounded-full bg-white shadow-sm text-gray-400 hover:text-gray-600"
                            >
                                <IconPlus />
                            </button>
                        </div>
                    </div>

                    {/* キャンバスエリア（マップ） */}
                    <div className="flex-1 relative w-full h-full">
                        {currentItems.length === 0 && (
                            <div className="absolute inset-0 flex items-center justify-center text-gray-400 text-sm pointer-events-none px-8 text-center leading-relaxed">
                                下のボタンから言葉や写真を<br/>追加してみましょう✨
                            </div>
                        )}

                        {currentItems.map(item => (
                            <DraggableItem 
                                key={item.id} 
                                item={item} 
                                updateItem={updateItem}
                                bringToFront={bringToFront}
                                onClick={(i) => i.type === 'text' ? setEditingTextItem(i) : setEditingImageItem(i)}
                            >
                                {item.type === 'text' && (
                                    // テキスト要素：コンパクトな余白、選択されたパステルカラー背景
                                    <div 
                                        className="rounded-xl shadow-sm border border-black/5 whitespace-pre-wrap break-words text-[#443] font-medium"
                                        style={{ 
                                            backgroundColor: item.color,
                                            padding: '4px 10px', // 余白少なくコンパクトに
                                            fontSize: '15px',
                                            lineHeight: '1.3',
                                            maxWidth: '220px'
                                        }}
                                    >
                                        {item.content || '（空のテキスト）'}
                                    </div>
                                )}
                                {item.type === 'image' && (
                                    // 画像要素：完全な円形、余計なフレームや影なし
                                    <img 
                                        src={item.src} 
                                        alt="Wish item" 
                                        style={{
                                            width: `${item.size}px`,
                                            height: `${item.size}px`,
                                            borderRadius: '50%',
                                            objectFit: 'cover'
                                        }}
                                    />
                                )}
                            </DraggableItem>
                        ))}
                    </div>

                    {/* ボトムツールバー */}
                    <div className="absolute bottom-6 left-1/2 -translate-x-1/2 flex gap-4 z-10">
                        <button 
                            onClick={handleAddTextClick}
                            className="w-14 h-14 bg-white rounded-full shadow-lg flex items-center justify-center text-[#AEC6CF] hover:bg-gray-50 transition-transform active:scale-95"
                        >
                            <IconText />
                        </button>
                        
                        <input 
                            type="file" 
                            accept="image/*" 
                            className="hidden" 
                            ref={fileInputRef} 
                            onChange={handleImageUpload} 
                        />
                        <button 
                            onClick={() => fileInputRef.current?.click()}
                            className="w-14 h-14 bg-white rounded-full shadow-lg flex items-center justify-center text-[#FFD1DC] hover:bg-gray-50 transition-transform active:scale-95"
                        >
                            <IconImage />
                        </button>
                    </div>

                    {/* --- モーダル群 --- */}
                    
                    {/* テキスト編集モーダル */}
                    {editingTextItem && (
                        <div className="absolute inset-0 bg-black/40 z-50 flex flex-col justify-end">
                            <div className="bg-white rounded-t-3xl p-6 shadow-xl animate-[slideUp_0.3s_ease-out]">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-[#665] font-bold">言葉を編集</h3>
                                    {!editingTextItem.isNew && (
                                        <button onClick={() => { deleteItem(editingTextItem.id); setEditingTextItem(null); }} className="text-red-400 p-2">
                                            <IconTrash />
                                        </button>
                                    )}
                                </div>
                                <textarea
                                    className="w-full bg-gray-50 rounded-xl p-4 mb-4 outline-none text-[#443] resize-none h-24"
                                    placeholder="あなたの想いをここに..."
                                    value={editingTextItem.content}
                                    onChange={(e) => setEditingTextItem({...editingTextItem, content: e.target.value})}
                                    autoFocus
                                />
                                <div className="mb-6">
                                    <p className="text-sm text-gray-500 mb-2">背景色</p>
                                    <div className="flex flex-wrap gap-3">
                                        {PASTEL_COLORS.map(color => (
                                            <button
                                                key={color}
                                                className={`w-8 h-8 rounded-full border-2 transition-transform ${editingTextItem.color === color ? 'border-gray-400 scale-110' : 'border-transparent'}`}
                                                style={{ backgroundColor: color }}
                                                onClick={() => setEditingTextItem({...editingTextItem, color})}
                                            />
                                        ))}
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button 
                                        onClick={() => setEditingTextItem(null)} 
                                        className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold"
                                    >
                                        キャンセル
                                    </button>
                                    <button 
                                        onClick={() => {
                                            if (editingTextItem.isNew) {
                                                const { isNew, ...itemData } = editingTextItem;
                                                setItems(prev => [...prev, itemData]);
                                            } else {
                                                updateItem(editingTextItem.id, { content: editingTextItem.content, color: editingTextItem.color });
                                            }
                                            setEditingTextItem(null);
                                        }} 
                                        className="flex-1 py-3 rounded-xl bg-[#AEC6CF] text-white font-bold"
                                    >
                                        完了
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 画像編集（サイズ変更）モーダル */}
                    {editingImageItem && (
                        <div className="absolute inset-0 bg-black/40 z-50 flex flex-col justify-end">
                            <div className="bg-white rounded-t-3xl p-6 shadow-xl animate-[slideUp_0.3s_ease-out]">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-[#665] font-bold">写真のサイズ調整</h3>
                                    <button onClick={() => { deleteItem(editingImageItem.id); setEditingImageItem(null); }} className="text-red-400 p-2">
                                        <IconTrash />
                                    </button>
                                </div>
                                
                                <div className="flex justify-center mb-6">
                                    <img 
                                        src={editingImageItem.src} 
                                        style={{ 
                                            width: `${editingImageItem.size}px`, 
                                            height: `${editingImageItem.size}px`, 
                                            borderRadius: '50%', 
                                            objectFit: 'cover' 
                                        }} 
                                    />
                                </div>

                                <div className="mb-8 px-2">
                                    <input 
                                        type="range" 
                                        min="40" 
                                        max="250" 
                                        value={editingImageItem.size} 
                                        onChange={(e) => setEditingImageItem({...editingImageItem, size: Number(e.target.value)})}
                                    />
                                </div>

                                <div className="flex gap-3">
                                    <button 
                                        onClick={() => {
                                            if (editingImageItem.isNew && items.find(i => i.id === editingImageItem.id)) {
                                                // 新規アップロード直後にキャンセルした場合は消す
                                                deleteItem(editingImageItem.id);
                                            }
                                            setEditingImageItem(null);
                                        }} 
                                        className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold"
                                    >
                                        キャンセル
                                    </button>
                                    <button 
                                        onClick={() => {
                                            const { isNew, ...data } = editingImageItem;
                                            updateItem(editingImageItem.id, { size: editingImageItem.size });
                                            setEditingImageItem(null);
                                        }} 
                                        className="flex-1 py-3 rounded-xl bg-[#FFD1DC] text-[#655] font-bold"
                                    >
                                        完了
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* タブ追加モーダル */}
                    {isTabModalOpen && (
                        <div className="absolute inset-0 bg-black/40 z-50 flex items-center justify-center px-4">
                            <div className="bg-white rounded-3xl p-6 shadow-xl w-full max-w-sm animate-[fadeIn_0.2s_ease-out]">
                                <h3 className="text-[#665] font-bold mb-4 text-center">新しいカテゴリを追加</h3>
                                <input
                                    type="text"
                                    className="w-full bg-gray-50 rounded-xl p-4 mb-6 outline-none text-center"
                                    placeholder="例：仕事、趣味、欲しいもの"
                                    value={newTabName}
                                    onChange={(e) => setNewTabName(e.target.value)}
                                    autoFocus
                                />
                                <div className="flex gap-3">
                                    <button 
                                        onClick={() => { setIsTabModalOpen(false); setNewTabName(''); }} 
                                        className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold"
                                    >
                                        キャンセル
                                    </button>
                                    <button 
                                        onClick={handleAddTab} 
                                        disabled={!newTabName.trim()}
                                        className="flex-1 py-3 rounded-xl bg-[#C1E1C1] text-[#454] font-bold disabled:opacity-50"
                                    >
                                        追加する
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
