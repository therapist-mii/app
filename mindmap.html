<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>願いのマップ</title>
  
  <!-- iOS向け設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="願いのマップ">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    body {
      background-color: #fafafa;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
    }
    .map-canvas {
      touch-action: none; /* ドラッグ時のスクロールを無効化 */
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script>
    // ホーム画面追加用のアイコン(✨)とマニフェストを動的生成
    (function() {
      const canvas = document.createElement('canvas');
      canvas.width = 192; canvas.height = 192;
      const ctx = canvas.getContext('2d');
      // パステルイエローの背景
      ctx.fillStyle = '#fdfd96';
      ctx.beginPath(); ctx.roundRect(0, 0, 192, 192, 40); ctx.fill();
      // ✨アイコン
      ctx.font = '96px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('✨', 96, 104);
      const dataUrl = canvas.toDataURL('image/png');
      
      const appleIcon = document.createElement('link');
      appleIcon.rel = 'apple-touch-icon'; appleIcon.href = dataUrl;
      document.head.appendChild(appleIcon);

      const favicon = document.createElement('link');
      favicon.rel = 'icon'; favicon.href = dataUrl;
      document.head.appendChild(favicon);

      const manifest = {
        name: "願いのマップ", short_name: "願いのマップ",
        display: "standalone", background_color: "#fafafa", theme_color: "#fdfd96",
        icons: [{ src: dataUrl, sizes: "192x192", type: "image/png" }]
      };
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }));
      document.head.appendChild(manifestLink);
    })();
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 設定・定数 ---
    const STORAGE_KEY = 'wish_map_data';
    const PASTEL_COLORS = [
      '#ffffff', '#ffe4e1', '#ffb6c1', '#ffc0cb', '#ffb3ba', 
      '#ffdfba', '#ffb347', '#ffffba', '#fdfd96', '#baffc9', 
      '#77dd77', '#bae1ff', '#aec6cf', '#e6e6fa', '#b19cd9'
    ];

    // --- アイコンコンポーネント ---
    const IconPlus = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const IconText = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>;
    const IconImage = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>;
    const IconEdit = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>;

    // --- モーダルコンポーネント ---
    const ModalWrapper = ({ children, onClose }) => (
      <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4" onClick={onClose}>
        <div className="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl transform transition-all" onClick={e => e.stopPropagation()}>
          {children}
        </div>
      </div>
    );

    // テキスト編集モーダル
    const TextModal = ({ item, onSave, onClose, onDelete }) => {
      const [content, setContent] = useState(item ? item.content : '');
      const [color, setColor] = useState(item ? item.color : '#fdfd96');

      return (
        <ModalWrapper onClose={onClose}>
          <div className="p-5 border-b border-gray-100"><h3 className="text-lg font-bold text-gray-700 text-center">{item ? '言葉を編集' : '言葉を追加'}</h3></div>
          <div className="p-5 space-y-5">
            <textarea 
              value={content} onChange={e => setContent(e.target.value)}
              className="w-full border-2 border-gray-100 rounded-2xl p-4 focus:outline-none focus:border-pink-300 resize-none h-32 text-gray-800"
              placeholder="あなたの想いや願いを書いてください..."
            />
            <div>
              <label className="block text-sm font-medium text-gray-500 mb-3 text-center">背景カラー</label>
              <div className="flex flex-wrap justify-center gap-3">
                {PASTEL_COLORS.map(c => (
                  <button key={c} onClick={() => setColor(c)}
                    className={`w-9 h-9 rounded-full border-2 transition-transform ${color === c ? 'border-gray-400 scale-110' : 'border-gray-100'}`}
                    style={{ backgroundColor: c }}
                  />
                ))}
              </div>
            </div>
          </div>
          <div className="p-4 bg-gray-50 flex justify-between items-center">
            {item ? <button onClick={onDelete} className="text-red-400 px-3 py-2 font-bold text-sm">削除</button> : <div></div>}
            <div className="flex space-x-3">
              <button onClick={onClose} className="px-4 py-2 text-gray-500 font-bold text-sm rounded-full bg-gray-200">キャンセル</button>
              <button onClick={() => onSave({ content, color })} disabled={!content.trim()}
                className="px-6 py-2 bg-pink-400 text-white rounded-full font-bold text-sm shadow-md disabled:opacity-50">保存</button>
            </div>
          </div>
        </ModalWrapper>
      );
    };

    // 画像サイズ編集モーダル
    const ImageModal = ({ item, onSave, onClose, onDelete }) => {
      const [size, setSize] = useState(item.size);
      return (
        <ModalWrapper onClose={onClose}>
          <div className="p-5 border-b border-gray-100"><h3 className="text-lg font-bold text-gray-700 text-center">写真の調整</h3></div>
          <div className="p-6 flex flex-col items-center space-y-8">
            <div className="relative flex items-center justify-center h-48 w-full bg-gray-50 rounded-2xl border border-gray-100 overflow-hidden">
               <img src={item.src} style={{ width: size, height: size }} className="rounded-full object-cover shadow-sm transition-all" />
            </div>
            <div className="w-full px-4">
              <div className="flex justify-between text-xs text-gray-400 font-medium mb-2"><span>小さく</span><span>大きく</span></div>
              <input type="range" min="50" max="250" value={size} onChange={e => setSize(Number(e.target.value))} className="w-full accent-pink-400" />
            </div>
          </div>
          <div className="p-4 bg-gray-50 flex justify-between items-center">
            <button onClick={onDelete} className="text-red-400 px-3 py-2 font-bold text-sm">削除</button>
            <div className="flex space-x-3">
              <button onClick={onClose} className="px-4 py-2 text-gray-500 font-bold text-sm rounded-full bg-gray-200">キャンセル</button>
              <button onClick={() => onSave({ size })} className="px-6 py-2 bg-pink-400 text-white rounded-full font-bold text-sm shadow-md">決定</button>
            </div>
          </div>
        </ModalWrapper>
      );
    };

    // --- メインアプリ ---
    function App() {
      // データの初期化
      const [maps, setMaps] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) return JSON.parse(saved);
        } catch(e) { console.error("データ読み込みエラー"); }
        return [{ id: 'map_' + Date.now(), name: '願い', items: [] }];
      });
      
      const [activeMapId, setActiveMapId] = useState(maps[0].id);
      
      // モーダル状態
      const [editingText, setEditingText] = useState(null); // { item: null | Item }  (null=追加, Item=編集)
      const [editingImage, setEditingImage] = useState(null);

      // 保存処理
      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(maps)); }
        catch(e) { alert("保存容量がいっぱいです。不要な写真を削除してください。"); }
      }, [maps]);

      const activeMap = maps.find(m => m.id === activeMapId) || maps[0];

      // --- マップ操作 ---
      const handleAddMap = () => {
        const name = prompt("新しいマップの名前を入力してください", "新しいマップ");
        if (name && name.trim()) {
          const newMap = { id: 'map_' + Date.now(), name: name.trim(), items: [] };
          setMaps([...maps, newMap]);
          setActiveMapId(newMap.id);
        }
      };

      const handleEditMapName = (id, currentName) => {
        const name = prompt("マップの名前を変更しますか？", currentName);
        if (name && name.trim()) {
          setMaps(maps.map(m => m.id === id ? { ...m, name: name.trim() } : m));
        }
      };

      // --- アイテム操作 ---
      const updateMapItems = (updater) => {
        setMaps(maps.map(m => m.id === activeMapId ? { ...m, items: updater(m.items) } : m));
      };

      const handleSaveText = (data) => {
        if (editingText.item) {
          // 更新
          updateMapItems(items => items.map(i => i.id === editingText.item.id ? { ...i, ...data } : i));
        } else {
          // 新規
          const newItem = {
            id: 'item_' + Date.now(), type: 'text',
            x: window.innerWidth / 2, y: window.innerHeight / 2,
            zIndex: Date.now(), ...data
          };
          updateMapItems(items => [...items, newItem]);
        }
        setEditingText(null);
      };

      const handleSaveImage = (data) => {
        updateMapItems(items => items.map(i => i.id === editingImage.id ? { ...i, ...data } : i));
        setEditingImage(null);
      };

      const handleDeleteItem = (id) => {
        updateMapItems(items => items.filter(i => i.id !== id));
        setEditingText(null); setEditingImage(null);
      };

      // --- 画像アップロード ---
      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const size = Math.min(img.width, img.height);
            // 正方形にクロップ＆最大サイズ制限（容量節約）
            let targetSize = size;
            if (targetSize > 300) targetSize = 300; 
            canvas.width = targetSize; canvas.height = targetSize;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, (img.width - size)/2, (img.height - size)/2, size, size, 0, 0, targetSize, targetSize);
            
            const newItem = {
              id: 'item_' + Date.now(), type: 'image',
              src: canvas.toDataURL('image/jpeg', 0.8),
              x: window.innerWidth / 2, y: window.innerHeight / 2,
              size: 120, zIndex: Date.now()
            };
            updateMapItems(items => [...items, newItem]);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
        e.target.value = ''; // リセット
      };

      // --- ドラッグ＆ドロップ（タッチ操作） ---
      const [dragInfo, setDragInfo] = useState(null);
      const [clickStart, setClickStart] = useState(null); // タップ判定用

      const handlePointerDown = (e, item) => {
        // e.preventDefault(); // これを入れるとテキスト選択ができないが、キャンバス全体にtouch-action:noneをかけているので不要
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        if(clientX == null) return;

        setDragInfo({ id: item.id, startX: clientX, startY: clientY, initX: item.x, initY: item.y });
        setClickStart({ id: item.id, x: clientX, y: clientY, time: Date.now() });
        // 手前に持ってくる
        updateMapItems(items => items.map(i => i.id === item.id ? { ...i, zIndex: Date.now() } : i));
      };

      const handlePointerMove = (e) => {
        if (!dragInfo) return;
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        if(clientX == null) return;

        const dx = clientX - dragInfo.startX;
        const dy = clientY - dragInfo.startY;
        updateMapItems(items => items.map(i => i.id === dragInfo.id ? { ...i, x: dragInfo.initX + dx, y: dragInfo.initY + dy } : i));
      };

      const handlePointerUp = (e) => {
        if (dragInfo && clickStart && dragInfo.id === clickStart.id) {
          const clientX = e.clientX || (e.changedTouches && e.changedTouches[0].clientX);
          const clientY = e.clientY || (e.changedTouches && e.changedTouches[0].clientY);
          if (clientX != null) {
            const dx = clientX - clickStart.x;
            const dy = clientY - clickStart.y;
            const dt = Date.now() - clickStart.time;
            // 移動距離が少なく、短時間なら「タップ」と判定
            if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && dt < 400) {
              const item = activeMap.items.find(i => i.id === dragInfo.id);
              if (item.type === 'text') setEditingText({ item });
              if (item.type === 'image') setEditingImage(item);
            }
          }
        }
        setDragInfo(null);
        setClickStart(null);
      };

      return (
        <div className="flex flex-col h-screen overflow-hidden relative">
          
          {/* タブエリア */}
          <div className="flex items-center overflow-x-auto bg-white/80 backdrop-blur-md border-b border-gray-100 px-3 py-3 hide-scrollbar z-10 shadow-sm">
            {maps.map(m => (
              <button key={m.id} onClick={() => setActiveMapId(m.id)} onDoubleClick={() => handleEditMapName(m.id, m.name)}
                className={`flex-shrink-0 px-5 py-2 mx-1 rounded-full text-sm font-bold transition-all ${
                  activeMapId === m.id ? 'bg-pink-100 text-pink-500 shadow-sm' : 'text-gray-400 bg-gray-50 hover:bg-gray-100'
                }`}>
                {m.name}
              </button>
            ))}
            <button onClick={handleAddMap} className="flex-shrink-0 w-9 h-9 mx-1 rounded-full bg-gray-50 flex items-center justify-center text-gray-400 hover:bg-gray-100 shadow-sm">
              <IconPlus />
            </button>
          </div>

          {/* キャンバスエリア */}
          <div 
            className="flex-1 map-canvas relative overflow-hidden"
            onMouseMove={handlePointerMove} onMouseUp={handlePointerUp} onMouseLeave={handlePointerUp}
            onTouchMove={handlePointerMove} onTouchEnd={handlePointerUp} onTouchCancel={handlePointerUp}
          >
            {activeMap.items.map(item => (
              <div key={item.id}
                style={{ position: 'absolute', left: item.x, top: item.y, zIndex: item.zIndex || 1, transform: 'translate(-50%, -50%)' }}
                onMouseDown={e => handlePointerDown(e, item)}
                onTouchStart={e => handlePointerDown(e, item)}
                className="cursor-move"
              >
                {item.type === 'text' && (
                  <div style={{ backgroundColor: item.color }} className="whitespace-pre-wrap text-sm sm:text-base px-4 py-2 rounded-2xl shadow-md border border-black/5 text-gray-800 font-medium select-none text-center leading-snug">
                    {item.content}
                  </div>
                )}
                {item.type === 'image' && (
                  <img src={item.src} style={{ width: item.size, height: item.size }} className="rounded-full object-cover shadow-lg border-2 border-white pointer-events-none select-none" draggable="false" />
                )}
              </div>
            ))}
            
            {/* ガイドメッセージ (アイテムが空の時) */}
            {activeMap.items.length === 0 && (
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none opacity-40">
                <div className="text-center text-gray-400">
                  <p className="text-lg font-bold mb-2">マップは空です</p>
                  <p className="text-sm">下のボタンから言葉や写真を追加してください</p>
                </div>
              </div>
            )}
          </div>

          {/* ツールバー */}
          <div className="bg-white/90 backdrop-blur-md border-t border-gray-100 px-6 py-4 flex justify-around items-center pb-safe z-10 shadow-[0_-4px_20px_-10px_rgba(0,0,0,0.1)]">
            <button onClick={() => setEditingText({ item: null })} className="flex flex-col items-center justify-center text-gray-500 hover:text-pink-400 transition-colors w-20">
              <div className="bg-gray-50 p-3 rounded-full mb-1 shadow-sm"><IconText /></div>
              <span className="text-xs font-bold">言葉</span>
            </button>
            <label className="flex flex-col items-center justify-center text-gray-500 hover:text-pink-400 transition-colors cursor-pointer w-20">
              <div className="bg-gray-50 p-3 rounded-full mb-1 shadow-sm"><IconImage /></div>
              <span className="text-xs font-bold">写真</span>
              <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
            </label>
          </div>

          {/* モーダル群 */}
          {editingText && (
            <TextModal item={editingText.item} onSave={handleSaveText} onClose={() => setEditingText(null)} onDelete={() => handleDeleteItem(editingText.item.id)} />
          )}
          {editingImage && (
            <ImageModal item={editingImage} onSave={handleSaveImage} onClose={() => setEditingImage(null)} onDelete={() => handleDeleteItem(editingImage.id)} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
