<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>願いのマップ</title>
  
  <!-- PWA設定・ホーム画面追加時のアイコンと名前 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="願いのマップ">
  <link rel="apple-touch-icon" href="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2720%27%20fill%3D%27%23FFDFBA%27%2F%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2750%25%27%20font-size%3D%2760%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27central%27%3E%E2%9C%A8%3C%2Ftext%3E%3C%2Fsvg%3E">
  <link rel="icon" href="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2720%27%20fill%3D%27%23FFDFBA%27%2F%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2750%25%27%20font-size%3D%2760%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27central%27%3E%E2%9C%A8%3C%2Ftext%3E%3C%2Fsvg%3E">

  <!-- ライブラリ読み込み (Tailwind, React, Babel) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* アプリらしい挙動にするためのスタイル設定 */
    body {
      background-color: #FAFAFA;
      overflow: hidden; /* 全体のスクロール禁止 */
      overscroll-behavior-y: none; /* iOSのバウンススクロール禁止 */
      -webkit-tap-highlight-color: transparent;
    }
    
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* ドラッグ時のブラウザデフォルト動作を防止 */
    .draggable-item {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    
    .item-text-content {
      word-break: break-word;
      white-space: pre-wrap;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 設定値・定数 ---
    const STORAGE_KEY = 'negai_map_app_data_v1';
    
    // パステルカラーのパレット
    const PASTEL_COLORS = [
      '#FFB3BA', // ピンク
      '#FFDFBA', // オレンジ
      '#FFFFBA', // イエロー
      '#BAFFC9', // グリーン
      '#BAE1FF', // ブルー
      '#E2CBF7', // パープル
      '#F0E6EF', // ライトピンク
      '#FFFFFF'  // ホワイト
    ];
    
    const generateId = () => Math.random().toString(36).substr(2, 9);

    // --- SVG アイコン ---
    const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const IconText = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>;
    const IconImage = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>;
    const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
    const IconClose = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;

    // --- コンポーネント: ドラッグ可能なアイテム ---
    const DraggableItem = ({ item, updateItem, bringToFront, onClick }) => {
      const dragRef = useRef(null);

      const handlePointerDown = (e) => {
        // 右クリックなどは無視
        if (e.button !== 0 && !e.type.includes('touch')) return; 
        e.stopPropagation();
        e.preventDefault();
        
        bringToFront(item.id);

        const target = e.currentTarget;
        const rect = target.getBoundingClientRect();
        const parentRect = target.parentElement.getBoundingClientRect();
        
        // タッチとマウス座標の統一
        const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

        dragRef.current = {
          startX: clientX,
          startY: clientY,
          isMoved: false,
          offsetX: clientX - rect.left,
          offsetY: clientY - rect.top,
          parentLeft: parentRect.left,
          parentTop: parentRect.top
        };

        const handleMove = (moveEvent) => {
          if (!dragRef.current) return;
          
          const mx = moveEvent.type.includes('touch') ? moveEvent.touches[0].clientX : moveEvent.clientX;
          const my = moveEvent.type.includes('touch') ? moveEvent.touches[0].clientY : moveEvent.clientY;

          // 一定距離動いたら「ドラッグ中」と判定（クリックとの誤爆防止）
          if (!dragRef.current.isMoved) {
            if (Math.abs(mx - dragRef.current.startX) > 3 || Math.abs(my - dragRef.current.startY) > 3) {
              dragRef.current.isMoved = true;
            }
          }
          
          if (dragRef.current.isMoved) {
              const newX = mx - dragRef.current.parentLeft - dragRef.current.offsetX;
              const newY = my - dragRef.current.parentTop - dragRef.current.offsetY;
              updateItem(item.id, { x: newX, y: newY });
          }
        };

        const handleUp = () => {
          window.removeEventListener('pointermove', handleMove);
          window.removeEventListener('pointerup', handleUp);
          window.removeEventListener('touchmove', handleMove);
          window.removeEventListener('touchend', handleUp);
          
          // 動かしていなければクリック（編集）として扱う
          if (dragRef.current && !dragRef.current.isMoved) {
            onClick(item);
          }
          dragRef.current = null;
        };

        if (e.type.includes('touch')) {
            window.addEventListener('touchmove', handleMove, { passive: false });
            window.addEventListener('touchend', handleUp);
        } else {
            window.addEventListener('pointermove', handleMove);
            window.addEventListener('pointerup', handleUp);
        }
      };

      // テキストアイテムの描画
      if (item.type === 'text') {
        return (
          <div
            className="draggable-item absolute cursor-pointer rounded-2xl px-4 py-2 text-[15px] font-medium text-gray-700 transition-shadow shadow-sm hover:shadow-md border border-black/5"
            style={{ 
              left: `${item.x}px`, 
              top: `${item.y}px`, 
              backgroundColor: item.color,
              maxWidth: '80vw',
              minWidth: '60px',
              textAlign: 'center'
            }}
            onPointerDown={handlePointerDown}
            onTouchStart={handlePointerDown}
          >
            <div className="item-text-content">{item.content || ' '}</div>
          </div>
        );
      }

      // 画像アイテムの描画（完全な円形、枠・影なし）
      if (item.type === 'image') {
        return (
          <div
            className="draggable-item absolute cursor-pointer rounded-full overflow-hidden border-0 shadow-none"
            style={{ 
              left: `${item.x}px`, 
              top: `${item.y}px`, 
              width: `${item.size}px`,
              height: `${item.size}px`,
            }}
            onPointerDown={handlePointerDown}
            onTouchStart={handlePointerDown}
          >
            <img 
              src={item.src} 
              alt="uploaded" 
              className="w-full h-full object-cover pointer-events-none" 
              draggable="false"
            />
          </div>
        );
      }

      return null;
    };

    // --- メインアプリケーション ---
    const App = () => {
      // 状態: マップデータ
      const [maps, setMaps] = useState([{ id: 'default', name: '願い', items: [] }]);
      const [activeMapId, setActiveMapId] = useState('default');
      const [isLoaded, setIsLoaded] = useState(false);
      
      // 状態: モーダル（編集画面）
      const [editingTextItem, setEditingTextItem] = useState(null);
      const [editingImageItem, setEditingImageItem] = useState(null);
      
      const canvasRef = useRef(null);

      // 初期データ読み込み (LocalStorage)
      useEffect(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.maps && parsed.maps.length > 0) {
              setMaps(parsed.maps);
              setActiveMapId(parsed.activeMapId || parsed.maps[0].id);
            }
          }
        } catch (e) { console.error("Load failed", e); }
        setIsLoaded(true);
      }, []);

      // データ保存 (LocalStorage)
      useEffect(() => {
        if (!isLoaded) return;
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ maps, activeMapId }));
      }, [maps, activeMapId, isLoaded]);

      const activeMap = maps.find(m => m.id === activeMapId) || maps[0];

      // --- アイテムの追加・更新・削除 ---
      const addItem = (newItemParams) => {
        const id = generateId();
        // 画面中央付近に配置
        let startX = 100;
        let startY = 200;
        if (canvasRef.current) {
          startX = canvasRef.current.clientWidth / 2 - (newItemParams.size ? newItemParams.size/2 : 60);
          startY = canvasRef.current.clientHeight / 2 - 30;
          startX += (Math.random() - 0.5) * 40; // 少し散らす
          startY += (Math.random() - 0.5) * 40;
        }

        const newItem = { id, x: startX, y: startY, ...newItemParams };

        setMaps(prev => prev.map(m => m.id === activeMapId ? { ...m, items: [...m.items, newItem] } : m));
        return newItem;
      };

      const updateItem = (itemId, updates) => {
        setMaps(prev => prev.map(m => {
          if (m.id === activeMapId) {
            return { ...m, items: m.items.map(i => i.id === itemId ? { ...i, ...updates } : i) };
          }
          return m;
        }));
      };

      const deleteItem = (itemId) => {
        setMaps(prev => prev.map(m => m.id === activeMapId ? { ...m, items: m.items.filter(i => i.id !== itemId) } : m));
      };

      const bringToFront = (itemId) => {
        setMaps(prev => prev.map(m => {
          if (m.id === activeMapId) {
            const index = m.items.findIndex(i => i.id === itemId);
            if (index === -1) return m;
            const newItems = [...m.items];
            const item = newItems.splice(index, 1)[0];
            newItems.push(item);
            return { ...m, items: newItems };
          }
          return m;
        }));
      };

      // --- マップ（タブ）の操作 ---
      const createNewMap = () => {
        const name = prompt("新しいカテゴリの名前を入力してください", "新しいカテゴリ");
        if (name) {
          const newId = generateId();
          setMaps(prev => [...prev, { id: newId, name, items: [] }]);
          setActiveMapId(newId);
        }
      };
      
      const renameMap = (mapId) => {
        const map = maps.find(m => m.id === mapId);
        if(!map) return;
        const newName = prompt("カテゴリ名を変更", map.name);
        if (newName && newName.trim() !== '') {
          setMaps(prev => prev.map(m => m.id === mapId ? { ...m, name: newName } : m));
        }
      };

      // --- 画像のアップロードとリサイズ ---
      const processImageFile = (file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 800; // 保存容量を抑えるために縮小
            let width = img.width;
            let height = img.height;
            
            if (width > MAX_SIZE || height > MAX_SIZE) {
              if (width > height) {
                  height = (height / width) * MAX_SIZE;
                  width = MAX_SIZE;
              } else {
                  width = (width / height) * MAX_SIZE;
                  height = MAX_SIZE;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            // WebPに変換して容量を劇的に削減
            const dataUrl = canvas.toDataURL('image/webp', 0.85);
            
            addItem({ type: 'image', src: dataUrl, size: 120 });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      };

      // --- UI イベントハンドラ ---
      const handleAddText = () => {
        const newItem = addItem({ type: 'text', content: '', color: PASTEL_COLORS[0] });
        setEditingTextItem(newItem);
      };

      const handleItemClick = (item) => {
        if (item.type === 'text') setEditingTextItem(item);
        if (item.type === 'image') setEditingImageItem(item);
      };

      if (!isLoaded) return null;

      return (
        <div className="h-screen w-screen flex flex-col bg-[#FAFAFA] font-sans text-gray-800 relative">
          
          {/* ヘッダー・タブ */}
          <div className="flex-none bg-white/80 backdrop-blur-md border-b border-gray-100 z-10 pt-[env(safe-area-inset-top)] shadow-sm">
            <div className="flex items-center p-2">
              <div className="flex-1 flex overflow-x-auto no-scrollbar gap-2 px-1 items-center pb-1">
                {maps.map(map => (
                  <button
                    key={map.id}
                    onClick={() => setActiveMapId(map.id)}
                    onDoubleClick={() => renameMap(map.id)}
                    className={`whitespace-nowrap px-4 py-1.5 rounded-full text-sm transition-colors flex items-center gap-1 ${
                      activeMapId === map.id 
                        ? 'bg-pink-100/70 text-pink-700 font-medium' 
                        : 'bg-transparent text-gray-500 hover:bg-gray-100'
                    }`}
                  >
                    {map.name}
                  </button>
                ))}
                <button 
                  onClick={createNewMap}
                  className="w-7 h-7 flex-none flex items-center justify-center rounded-full bg-gray-100 text-gray-400 hover:bg-gray-200 ml-1"
                >
                  <IconPlus />
                </button>
              </div>
            </div>
          </div>

          {/* マップ（配置エリア） */}
          <div 
            ref={canvasRef}
            className="flex-1 relative overflow-hidden"
          >
            {activeMap.items.map(item => (
              <DraggableItem 
                key={item.id} 
                item={item} 
                updateItem={updateItem} 
                bringToFront={bringToFront}
                onClick={handleItemClick}
              />
            ))}
          </div>

          {/* ボトムツールバー (固定) */}
          <div className="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex items-center gap-8 bg-white/90 backdrop-blur px-8 py-3.5 rounded-full shadow-[0_4px_20px_rgba(0,0,0,0.08)] border border-gray-100 z-20 pb-[calc(1.5rem+env(safe-area-inset-bottom))]">
            <button 
              onClick={handleAddText}
              className="flex flex-col items-center justify-center text-gray-400 hover:text-pink-400 transition-colors"
            >
              <div className="bg-pink-50 p-2.5 rounded-full mb-1">
                <IconText />
              </div>
              <span className="text-[10px] font-medium tracking-wide">言葉</span>
            </button>

            <div className="w-px h-8 bg-gray-100"></div>

            <label className="flex flex-col items-center justify-center text-gray-400 hover:text-blue-400 transition-colors cursor-pointer">
              <input 
                type="file" 
                accept="image/*" 
                className="hidden" 
                onChange={(e) => {
                  if (e.target.files[0]) processImageFile(e.target.files[0]);
                  e.target.value = '';
                }}
              />
              <div className="bg-blue-50 p-2.5 rounded-full mb-1">
                <IconImage />
              </div>
              <span className="text-[10px] font-medium tracking-wide">写真</span>
            </label>
          </div>

          {/* モーダル: テキスト編集 */}
          {editingTextItem && (
            <div className="fixed inset-0 bg-black/20 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-[2rem] w-full max-w-sm overflow-hidden shadow-2xl animate-fade-in-up">
                <div className="p-6 pb-2 flex justify-between items-center">
                  <h3 className="text-gray-700 font-medium">言葉の編集</h3>
                  <button onClick={() => setEditingTextItem(null)} className="text-gray-400 hover:text-gray-600">
                    <IconClose />
                  </button>
                </div>
                
                <div className="p-6 pt-4">
                  <textarea
                    autoFocus
                    value={editingTextItem.content}
                    onChange={(e) => updateItem(editingTextItem.id, { content: e.target.value })}
                    className="w-full h-32 p-4 rounded-2xl resize-none outline-none text-gray-800 transition-colors border-2 border-transparent focus:border-white/50 shadow-inner"
                    style={{ backgroundColor: editingTextItem.color }}
                    placeholder="想いや願いを書き留める..."
                  ></textarea>

                  <div className="mt-6">
                    <p className="text-xs text-gray-400 mb-3 font-medium">背景色を選ぶ</p>
                    <div className="flex flex-wrap gap-3">
                      {PASTEL_COLORS.map(color => (
                        <button
                          key={color}
                          onClick={() => updateItem(editingTextItem.id, { color })}
                          className={`w-8 h-8 rounded-full shadow-sm transition-transform ${editingTextItem.color === color ? 'ring-2 ring-gray-300 ring-offset-2 scale-110' : 'border border-gray-100'}`}
                          style={{ backgroundColor: color }}
                        />
                      ))}
                    </div>
                  </div>
                </div>

                <div className="p-4 bg-gray-50/50 flex justify-between items-center rounded-b-[2rem]">
                  <button 
                    onClick={() => { deleteItem(editingTextItem.id); setEditingTextItem(null); }}
                    className="flex items-center gap-1.5 text-red-400 hover:text-red-500 px-3 py-2 rounded-xl hover:bg-red-50 transition-colors"
                  >
                    <IconTrash />
                    <span className="text-sm font-medium">削除</span>
                  </button>
                  <button 
                    onClick={() => setEditingTextItem(null)}
                    className="bg-gray-800 text-white px-8 py-3 rounded-full text-sm font-medium shadow-md hover:bg-gray-700 transition-colors"
                  >
                    完了
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* モーダル: 画像編集 */}
          {editingImageItem && (
            <div className="fixed inset-0 bg-black/20 backdrop-blur-sm flex items-end sm:items-center justify-center p-4 z-50">
              <div className="bg-white rounded-[2rem] w-full max-w-sm shadow-2xl mb-4 sm:mb-0 animate-fade-in-up">
                <div className="p-6 pb-2 flex justify-between items-center">
                  <h3 className="text-gray-700 font-medium">写真の調整</h3>
                  <button onClick={() => setEditingImageItem(null)} className="text-gray-400 hover:text-gray-600">
                    <IconClose />
                  </button>
                </div>
                
                <div className="p-6 flex flex-col items-center">
                  {/* プレビューアイコン */}
                  <div 
                    className="rounded-full overflow-hidden mb-8 bg-gray-100 flex items-center justify-center"
                    style={{ width: '120px', height: '120px' }}
                  >
                    <img src={editingImageItem.src} className="w-full h-full object-cover" />
                  </div>

                  <div className="w-full px-2">
                    <div className="flex justify-between text-[11px] text-gray-400 mb-3 font-medium">
                      <span>小さく</span>
                      <span>大きく</span>
                    </div>
                    {/* サイズ変更スライダー */}
                    <input 
                      type="range" 
                      min="50" 
                      max="280" 
                      value={editingImageItem.size}
                      onChange={(e) => updateItem(editingImageItem.id, { size: parseInt(e.target.value) })}
                      className="w-full h-1.5 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-300"
                    />
                  </div>
                </div>

                <div className="p-4 bg-gray-50/50 flex justify-between items-center rounded-b-[2rem]">
                  <button 
                    onClick={() => { deleteItem(editingImageItem.id); setEditingImageItem(null); }}
                    className="flex items-center gap-1.5 text-red-400 hover:text-red-500 px-3 py-2 rounded-xl hover:bg-red-50 transition-colors"
                  >
                    <IconTrash />
                    <span className="text-sm font-medium">削除</span>
                  </button>
                  <button 
                    onClick={() => setEditingImageItem(null)}
                    className="bg-gray-800 text-white px-8 py-3 rounded-full text-sm font-medium shadow-md hover:bg-gray-700 transition-colors"
                  >
                    完了
                  </button>
                </div>
              </div>
            </div>
          )}

          <style dangerouslySetInnerHTML={{__html: `
            @keyframes fadeInUp {
              from { opacity: 0; transform: translateY(15px) scale(0.98); }
              to { opacity: 1; transform: translateY(0) scale(1); }
            }
            .animate-fade-in-up {
              animation: fadeInUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            }
          `}} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
