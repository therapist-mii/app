<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホでの拡大縮小を制限し、アプリのような挙動にする設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- ホーム画面追加時の設定 -->
    <title>願いのマップ</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="願いのマップ">
    <meta name="theme-color" content="#f9fafb">
    
    <!-- ホーム画面用の✨アイコン (SVGを直接埋め込み) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23fdfbfb'/><text y='.9em' x='10' font-size='80'>✨</text></svg>">

    <!-- フォントとライブラリの読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
            background-color: #f9fafb; /* 白に近いグレー */
            margin: 0;
            overflow: hidden; /* スクロール防止 */
            overscroll-behavior: none; /* スワイプバック防止 */
            touch-action: none;
        }
        #root {
            height: 100dvh; /* スマホブラウザのアドレスバーを考慮した高さ */
            width: 100vw;
        }
        /* スクロールバー非表示 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 設定値 ---
        const STORAGE_KEY = 'wish_map_app_data';
        const PASTEL_COLORS = [
            '#ffffff', // 白
            '#ffb3ba', // ピンク
            '#ffdfba', // オレンジ
            '#ffffba', // イエロー
            '#baffc9', // グリーン
            '#bae1ff', // ブルー
            '#e8baff', // パープル
            '#f0e6ef', // ペールパープル
            '#e2f0cb', // 若草色
            '#ffc4c4', // ローズ
        ];

        // --- アイコンコンポーネント ---
        const PlusIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>;
        const TextIcon = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 6.1H3"/><path d="M21 12.1H3"/><path d="M15.1 18H3"/></svg>;
        const ImageIcon = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>;
        const TrashIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;
        const EditIcon = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;

        // --- ユーティリティ ---
        // 画像を縮小・圧縮してデータURIに変換（保存容量節約のため）
        const compressImage = (file, callback) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 600;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > MAX_SIZE) {
                        height *= MAX_SIZE / width;
                        width = MAX_SIZE;
                    } else if (height > MAX_SIZE) {
                        width *= MAX_SIZE / height;
                        height = MAX_SIZE;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        // --- ドラッグ可能なアイテムコンポーネント ---
        const DraggableItem = ({ item, onUpdate, onClick, children }) => {
            const [pos, setPos] = useState({ x: item.x, y: item.y });
            const [isDragging, setIsDragging] = useState(false);
            const dragRef = useRef({ startX: 0, startY: 0, initX: 0, initY: 0, currentX: item.x, currentY: item.y, moved: false });

            useEffect(() => { 
                setPos({ x: item.x, y: item.y }); 
                dragRef.current.currentX = item.x;
                dragRef.current.currentY = item.y;
            }, [item.x, item.y]);

            const handleStart = (e) => {
                e.stopPropagation();
                setIsDragging(true);
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                dragRef.current = {
                    startX: clientX, 
                    startY: clientY, 
                    initX: pos.x, 
                    initY: pos.y, 
                    currentX: pos.x,
                    currentY: pos.y,
                    moved: false
                };
            };

            const handleMove = (e) => {
                if (!isDragging) return;
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                const dx = clientX - dragRef.current.startX;
                const dy = clientY - dragRef.current.startY;
                
                // 少しでも動いたらドラッグと判定
                if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                    dragRef.current.moved = true;
                }

                const newX = dragRef.current.initX + dx;
                const newY = dragRef.current.initY + dy;

                dragRef.current.currentX = newX;
                dragRef.current.currentY = newY;

                setPos({ x: newX, y: newY });
            };

            const handleEnd = (e) => {
                if (!isDragging) return;
                setIsDragging(false);
                
                if (!dragRef.current.moved) {
                    onClick(item); // 動かしていなければタップ（編集）として扱う
                } else {
                    onUpdate(item.id, { x: dragRef.current.currentX, y: dragRef.current.currentY }); // 移動完了時に最新の座標を保存
                }
            };

            useEffect(() => {
                if (isDragging) {
                    window.addEventListener('mousemove', handleMove);
                    window.addEventListener('mouseup', handleEnd);
                    window.addEventListener('touchmove', handleMove, { passive: false });
                    window.addEventListener('touchend', handleEnd);
                }
                return () => {
                    window.removeEventListener('mousemove', handleMove);
                    window.removeEventListener('mouseup', handleEnd);
                    window.removeEventListener('touchmove', handleMove);
                    window.removeEventListener('touchend', handleEnd);
                };
            }, [isDragging]);

            return (
                <div
                    style={{
                        position: 'absolute',
                        left: pos.x,
                        top: pos.y,
                        cursor: isDragging ? 'grabbing' : 'pointer',
                        touchAction: 'none',
                        zIndex: isDragging ? 50 : 10,
                        transform: isDragging ? 'scale(1.05)' : 'scale(1)',
                        transition: 'transform 0.1s ease-out'
                    }}
                    onMouseDown={handleStart}
                    onTouchStart={handleStart}
                >
                    {children}
                </div>
            );
        };

        // --- メインアプリ ---
        const App = () => {
            // 初期データのロード
            const [data, setData] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) {}
                }
                return {
                    maps: [{ id: 'map-' + Date.now(), name: '願い', items: [] }],
                    activeMapId: null
                };
            });

            const activeMapId = data.activeMapId || data.maps[0].id;
            const activeMap = data.maps.find(m => m.id === activeMapId) || data.maps[0];

            // モーダルの状態管理
            const [textModal, setTextModal] = useState({ isOpen: false, id: null, content: '', color: PASTEL_COLORS[1] });
            const [imageModal, setImageModal] = useState({ isOpen: false, id: null, src: '', size: 120 });

            // データの自動保存
            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }, [data]);

            // --- マップ操作 ---
            const handleAddMap = () => {
                const name = prompt('新しいマップの名前を入力してください');
                if (name && name.trim()) {
                    const newId = 'map-' + Date.now();
                    setData(prev => ({
                        ...prev,
                        maps: [...prev.maps, { id: newId, name: name.trim(), items: [] }],
                        activeMapId: newId
                    }));
                }
            };

            const handleEditMapName = (id, currentName) => {
                const newName = prompt('マップの新しい名前を入力してください', currentName);
                if (newName && newName.trim() && newName !== currentName) {
                    setData(prev => ({
                        ...prev,
                        maps: prev.maps.map(m => m.id === id ? { ...m, name: newName.trim() } : m)
                    }));
                }
            };

            // --- アイテム操作 ---
            const updateMapItems = (newItems) => {
                setData(prev => ({
                    ...prev,
                    maps: prev.maps.map(m => m.id === activeMapId ? { ...m, items: newItems } : m)
                }));
            };

            const handleUpdateItemPosition = (id, newPos) => {
                const newItems = activeMap.items.map(item => item.id === id ? { ...item, ...newPos } : item);
                updateMapItems(newItems);
            };

            const handleItemClick = (item) => {
                if (item.type === 'text') {
                    setTextModal({ isOpen: true, id: item.id, content: item.content, color: item.color });
                } else if (item.type === 'image') {
                    setImageModal({ isOpen: true, id: item.id, src: item.src, size: item.size });
                }
            };

            const handleDeleteItem = (id) => {
                updateMapItems(activeMap.items.filter(item => item.id !== id));
            };

            // --- テキスト保存 ---
            const saveText = () => {
                if (!textModal.content.trim()) return;
                let newItems;
                if (textModal.id) {
                    newItems = activeMap.items.map(item => item.id === textModal.id ? { ...item, content: textModal.content, color: textModal.color } : item);
                } else {
                    newItems = [...activeMap.items, {
                        id: 'text-' + Date.now(),
                        type: 'text',
                        x: window.innerWidth / 2 - 50,
                        y: window.innerHeight / 2 - 20,
                        content: textModal.content,
                        color: textModal.color
                    }];
                }
                updateMapItems(newItems);
                setTextModal({ ...textModal, isOpen: false });
            };

            // --- 画像アップロード ---
            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                compressImage(file, (dataUrl) => {
                    const size = 120;
                    const newItems = [...activeMap.items, {
                        id: 'img-' + Date.now(),
                        type: 'image',
                        x: window.innerWidth / 2 - (size / 2),
                        y: window.innerHeight / 2 - (size / 2),
                        src: dataUrl,
                        size: size
                    }];
                    updateMapItems(newItems);
                });
                e.target.value = ''; // 連続で同じ画像を選べるようにリセット
            };

            // --- 画像サイズ保存 ---
            const saveImageSize = () => {
                if (!imageModal.id) return;
                const newItems = activeMap.items.map(item => item.id === imageModal.id ? { ...item, size: imageModal.size } : item);
                updateMapItems(newItems);
                setImageModal({ ...imageModal, isOpen: false });
            };

            return (
                <div className="flex flex-col h-full w-full bg-gray-50 relative">
                    {/* ヘッダー・タブ領域 */}
                    <div className="flex-none bg-white shadow-sm border-b border-gray-100 z-40">
                        <div className="flex px-4 py-3 items-center justify-between text-pink-500 font-bold gap-1">
                            <div className="flex items-center gap-1">
                                <span>✨</span>
                                <span className="text-lg tracking-wide text-gray-700">願いのマップ</span>
                            </div>
                            <div className="flex gap-2">
                                <button 
                                    className="w-10 h-10 bg-white rounded-full shadow-sm flex items-center justify-center text-gray-500 hover:text-pink-500 active:scale-95 transition-all border border-gray-200"
                                    onClick={() => setTextModal({ isOpen: true, id: null, content: '', color: PASTEL_COLORS[1] })}
                                    title="テキストを追加"
                                >
                                    <TextIcon />
                                </button>
                                <label 
                                    className="w-10 h-10 bg-white rounded-full shadow-sm flex items-center justify-center text-gray-500 hover:text-blue-500 active:scale-95 transition-all border border-gray-200 cursor-pointer"
                                    title="画像を追加"
                                >
                                    <ImageIcon />
                                    <input type="file" accept="image/*" className="hidden" onChange={handleImageUpload} />
                                </label>
                            </div>
                        </div>
                        <div className="flex overflow-x-auto no-scrollbar px-3 pb-3 items-center">
                            {data.maps.map(m => (
                                <div
                                    key={m.id}
                                    className={`flex items-center whitespace-nowrap rounded-full mr-2 text-sm transition-all duration-200 cursor-pointer select-none ${
                                        m.id === activeMapId 
                                        ? 'bg-pink-100 text-pink-800 font-bold shadow-inner pl-5 pr-1 py-1' 
                                        : 'bg-gray-100 text-gray-500 hover:bg-gray-200 px-5 py-2'
                                    }`}
                                    onClick={() => {
                                        if (m.id !== activeMapId) {
                                            setData(prev => ({ ...prev, activeMapId: m.id }));
                                        }
                                    }}
                                >
                                    <span>{m.name}</span>
                                    {m.id === activeMapId && (
                                        <button 
                                            onClick={(e) => { e.stopPropagation(); handleEditMapName(m.id, m.name); }}
                                            className="ml-1 p-1.5 text-pink-500 hover:bg-pink-200 rounded-full transition-colors flex-shrink-0"
                                            title="名前を変更"
                                        >
                                            <EditIcon />
                                        </button>
                                    )}
                                </div>
                            ))}
                            <button onClick={handleAddMap} className="p-2 text-gray-400 bg-gray-100 rounded-full flex-shrink-0 hover:bg-gray-200 transition-colors ml-1">
                                <PlusIcon />
                            </button>
                        </div>
                    </div>

                    {/* マップ（キャンバス）領域 */}
                    <div className="flex-grow relative overflow-hidden" id="map-area">
                        {activeMap.items.map(item => (
                            <DraggableItem key={item.id} item={item} onUpdate={handleUpdateItemPosition} onClick={handleItemClick}>
                                {item.type === 'text' ? (
                                    <div 
                                        className="px-4 py-2 rounded-2xl shadow-sm text-gray-800 text-sm whitespace-pre-wrap leading-relaxed max-w-[220px] break-words border border-white/40"
                                        style={{ backgroundColor: item.color }}
                                    >
                                        {item.content}
                                    </div>
                                ) : (
                                    <img 
                                        src={item.src} 
                                        alt="memory" 
                                        className="rounded-full object-cover shadow-sm pointer-events-none"
                                        style={{ width: item.size, height: item.size }}
                                        draggable={false}
                                    />
                                )}
                            </DraggableItem>
                        ))}
                    </div>

                    {/* テキスト編集モーダル */}
                    {textModal.isOpen && (
                        <div className="absolute inset-0 bg-black/20 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                            <div className="bg-white rounded-[2rem] p-6 w-full max-w-sm shadow-xl" onClick={e => e.stopPropagation()}>
                                <textarea 
                                    className="w-full bg-gray-50 rounded-2xl p-4 mb-5 outline-none focus:ring-2 focus:ring-pink-200 resize-none text-gray-700"
                                    rows={4}
                                    value={textModal.content}
                                    onChange={e => setTextModal({...textModal, content: e.target.value})}
                                    placeholder="想いや願いを書いてみましょう..."
                                    autoFocus
                                />
                                <div className="flex flex-wrap gap-3 mb-6 justify-center">
                                    {PASTEL_COLORS.map(c => (
                                        <button
                                            key={c}
                                            className={`w-8 h-8 rounded-full border border-gray-200 transition-transform ${textModal.color === c ? 'scale-125 ring-2 ring-gray-300 ring-offset-2' : ''}`}
                                            style={{ backgroundColor: c }}
                                            onClick={() => setTextModal({...textModal, color: c})}
                                        />
                                    ))}
                                </div>
                                <div className="flex justify-between items-center mt-2">
                                    {textModal.id ? (
                                        <button onClick={() => { handleDeleteItem(textModal.id); setTextModal({...textModal, isOpen: false}); }} className="text-red-400 p-2 bg-red-50 rounded-full hover:bg-red-100 transition-colors">
                                            <TrashIcon />
                                        </button>
                                    ) : <div></div>}
                                    <div className="flex gap-3">
                                        <button onClick={() => setTextModal({...textModal, isOpen: false})} className="px-5 py-2.5 text-gray-500 rounded-full bg-gray-100 font-medium hover:bg-gray-200 transition-colors">キャンセル</button>
                                        <button onClick={saveText} className="px-6 py-2.5 bg-pink-400 text-white rounded-full font-medium shadow-md hover:bg-pink-500 transition-colors">完了</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 画像サイズ変更・削除モーダル */}
                    {imageModal.isOpen && (
                        <div className="absolute inset-0 bg-black/20 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                            <div className="bg-white rounded-[2rem] p-6 w-full max-w-sm shadow-xl flex flex-col items-center" onClick={e => e.stopPropagation()}>
                                <div className="mb-8 rounded-full overflow-hidden shadow-sm flex-shrink-0 bg-gray-100" style={{ width: imageModal.size, height: imageModal.size }}>
                                    <img src={imageModal.src} className="w-full h-full object-cover" />
                                </div>
                                
                                <div className="w-full px-2 mb-8 flex items-center gap-4">
                                    <span className="text-sm text-gray-400 font-medium">小</span>
                                    <input 
                                        type="range" 
                                        min="60" max="280" 
                                        value={imageModal.size} 
                                        onChange={e => setImageModal({...imageModal, size: Number(e.target.value)})}
                                        className="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-pink-400"
                                    />
                                    <span className="text-sm text-gray-400 font-medium">大</span>
                                </div>

                                <div className="flex justify-between items-center w-full mt-2">
                                    <button onClick={() => { handleDeleteItem(imageModal.id); setImageModal({...imageModal, isOpen: false}); }} className="text-red-400 p-2 bg-red-50 rounded-full hover:bg-red-100 transition-colors">
                                        <TrashIcon />
                                    </button>
                                    <div className="flex gap-3">
                                        <button onClick={() => setImageModal({...imageModal, isOpen: false})} className="px-5 py-2.5 text-gray-500 rounded-full bg-gray-100 font-medium hover:bg-gray-200 transition-colors">キャンセル</button>
                                        <button onClick={saveImageSize} className="px-6 py-2.5 bg-blue-400 text-white rounded-full font-medium shadow-md hover:bg-blue-500 transition-colors">完了</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
