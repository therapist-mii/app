<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color State Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+JP:wght@400;700&display=swap');
        
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f8fafc;
        }

        .color-preview {
            transition: transform 0.2s;
        }

        .color-preview:hover {
            transform: scale(1.05);
        }

        .copy-area {
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <!-- Header -->
        <div class="bg-gradient-to-r from-slate-800 to-slate-900 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">カラー・マインド・ロガー</h1>
            <p class="text-slate-400 text-sm mt-1">色と感情を記録し、タブ区切り形式で出力します</p>
        </div>

        <div class="p-6 md:p-10 space-y-8">
            <!-- Input Section -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
                <div class="space-y-4">
                    <label class="block text-sm font-semibold text-slate-700 uppercase tracking-wider">色を選択</label>
                    <div class="flex items-center space-x-4">
                        <!-- Default value changed to #FFFFFF -->
                        <input type="color" id="colorPicker" 
                               class="w-20 h-20 rounded-lg cursor-pointer border-2 border-slate-200 bg-white"
                               value="#FFFFFF">
                        <div id="hexValue" class="text-xl font-mono font-bold text-slate-800">#FFFFFF</div>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label for="mentalState" class="block text-sm font-semibold text-slate-700 mb-1">今の心の状態</label>
                        <input type="text" id="mentalState" placeholder="（例：穏やか、ワクワクしている）" 
                               class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-slate-500 focus:border-transparent outline-none transition-all">
                    </div>
                    <div>
                        <label for="theme" class="block text-sm font-semibold text-slate-700 mb-1">テーマ</label>
                        <input type="text" id="theme" placeholder="（例：今日のラッキーカラー、デザイン案）" 
                               class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-slate-500 focus:border-transparent outline-none transition-all">
                    </div>
                    <div>
                        <label for="impression" class="block text-sm font-semibold text-slate-700 mb-1">感じた印象</label>
                        <input type="text" id="impression" placeholder="（例：明るい未来、落ち着く）" 
                               class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-slate-500 focus:border-transparent outline-none transition-all">
                    </div>
                    <button id="addBtn" 
                            class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-6 rounded-lg shadow-lg transform active:scale-95 transition-all duration-150">
                        リストに追加する
                    </button>
                </div>
            </div>

            <hr class="border-slate-100">

            <!-- List Display Area -->
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-lg font-bold text-slate-800">記録されたリスト</h2>
                    <button id="clearBtn" class="text-sm text-red-500 hover:text-red-700 underline">全てクリア</button>
                </div>
                <div class="overflow-x-auto rounded-lg border border-slate-200">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase">色</th>
                                <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase">色コード</th>
                                <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase">心の状態</th>
                                <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase">テーマ</th>
                                <th class="px-4 py-3 text-xs font-bold text-slate-500 uppercase">印象</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody" class="divide-y divide-slate-100">
                            <!-- Rows injected here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Copy Paste Area -->
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <label class="block text-sm font-semibold text-slate-700 uppercase tracking-wider">コピペ用タブ区切りテキスト</label>
                    <button id="copyBtn" class="text-xs bg-slate-200 hover:bg-slate-300 px-3 py-1 rounded text-slate-700 font-medium transition-colors">
                        クリップボードにコピー
                    </button>
                </div>
                <textarea id="tabSeparatedOutput" readonly 
                          class="copy-area w-full h-40 p-4 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-600 focus:outline-none" 
                          placeholder="ここに追加されたデータがタブ区切りで表示されます"></textarea>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300 text-sm">
        コピーしました！
    </div>

    <script>
        const colorPicker = document.getElementById('colorPicker');
        const hexValue = document.getElementById('hexValue');
        const mentalStateInput = document.getElementById('mentalState');
        const themeInput = document.getElementById('theme');
        const impressionInput = document.getElementById('impression');
        const addBtn = document.getElementById('addBtn');
        const clearBtn = document.getElementById('clearBtn');
        const logTableBody = document.getElementById('logTableBody');
        const tabSeparatedOutput = document.getElementById('tabSeparatedOutput');
        const copyBtn = document.getElementById('copyBtn');
        const toast = document.getElementById('toast');

        let logs = [];

        // Update hex text on color pick
        colorPicker.addEventListener('input', (e) => {
            hexValue.textContent = e.target.value.toUpperCase();
        });

        // Add entry
        addBtn.addEventListener('click', () => {
            const entry = {
                color: colorPicker.value.toUpperCase(),
                state: mentalStateInput.value || "未入力",
                theme: themeInput.value || "未入力",
                impression: impressionInput.value || "未入力"
            };

            logs.push(entry);
            updateUI();

            // Reset inputs (but keep color)
            mentalStateInput.value = "";
            themeInput.value = "";
            impressionInput.value = "";
            mentalStateInput.focus();
        });

        // Clear all
        clearBtn.addEventListener('click', () => {
            if (confirm("全ての記録を消去しますか？")) {
                logs = [];
                updateUI();
            }
        });

        // Copy functionality
        copyBtn.addEventListener('click', () => {
            if (logs.length === 0) return;
            
            tabSeparatedOutput.select();
            document.execCommand('copy');
            
            // Show toast
            toast.style.opacity = "1";
            setTimeout(() => {
                toast.style.opacity = "0";
            }, 2000);
        });

        function updateUI() {
            // Render Table
            logTableBody.innerHTML = logs.map((log, index) => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-4 py-3">
                        <div class="w-6 h-6 rounded border border-slate-300" style="background-color: ${log.color}"></div>
                    </td>
                    <td class="px-4 py-3 font-mono text-sm">${log.color}</td>
                    <td class="px-4 py-3 text-sm">${log.state}</td>
                    <td class="px-4 py-3 text-sm">${log.theme}</td>
                    <td class="px-4 py-3 text-sm">${log.impression}</td>
                </tr>
            `).join('');

            // Render Tab Separated Text
            const header = "色コード\t今の心の状態\tテーマ\t感じた印象";
            const body = logs.map(log => 
                `${log.color}\t${log.state}\t${log.theme}\t${log.impression}`
            ).join('\n');

            tabSeparatedOutput.value = logs.length > 0 ? (header + '\n' + body) : "";
        }
    </script>
</body>
</html>
